plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.aeropropeller'
version = project.mod_version

base {
    archivesName = "${mod_id}-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.233'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        aero_propeller_addon {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // The player supplies these at runtime. They are compile-time only so that the
    // resulting jar contains only this addon's own classes and assets.
    compileOnly files(
            'libs/create-1.21.1-6.0.10.jar',
            'libs/aeronautics-1.3.2.jar',
            'libs/simulated-1.3.2.jar',
            'libs/sable-neoforge-1.21.1-2.0.6.jar',
            'libs/sable-companion-common-1.21.1-1.6.0.jar',
            'libs/flywheel-1.0.6.jar',
            'libs/ponder-1.0.82.jar',
            'libs/registrate-1.3.0.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
            'version'      : project.version,
            'mod_id'       : project.mod_id,
            'mod_name'     : project.mod_name,
            'mod_authors'  : 'Alanna233',
            'mod_license'  : 'MIT'
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}
